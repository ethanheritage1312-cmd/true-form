<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>True Form | Account</title>

  <style>
    :root {
      --cream: #f5f0e8;
      --dark: #20201e;
      --terracotta: #c76f4b;
      --muted: #77736d;
      --border: #e5ded5;
      --soft: #fcf3ee;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--cream);
      color: var(--dark);
      font-family: Arial, Helvetica, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 32px 26px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 12px 35px rgba(32, 32, 30, 0.07);
    }

    .brand {
      margin-bottom: 26px;
      text-align: center;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .brand span {
      color: var(--terracotta);
    }

    h1 {
      margin: 0 0 10px;
      text-align: center;
      font-size: 29px;
    }

    .intro {
      margin: 0 0 25px;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
      font-size: 14px;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-size: 14px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      color: var(--dark);
      font-size: 16px;
    }

    input:focus {
      outline: 2px solid var(--terracotta);
      outline-offset: 1px;
    }

    button {
      width: 100%;
      min-height: 47px;
      margin-top: 18px;
      padding: 12px 16px;
      border: 0;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary {
      background: var(--terracotta);
      color: white;
    }

    .google {
      background: white;
      color: var(--dark);
      border: 1px solid var(--border);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0 4px;
      color: var(--muted);
      font-size: 13px;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      flex: 1;
      background: var(--border);
    }

    .switch,
    .forgot {
      margin-top: 20px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .switch button,
    .forgot button {
      width: auto;
      min-height: 0;
      margin: 0;
      padding: 4px;
      background: none;
      color: var(--terracotta);
      font-size: inherit;
    }

    #message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 9px;
      background: var(--soft);
      color: var(--dark);
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .back {
      display: block;
      margin-top: 20px;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
      text-decoration: none;
    }

    .back:hover {
      color: var(--terracotta);
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="brand">TRUE <span>FORM</span></div>

    <h1 id="heading">Create your account</h1>
    <p class="intro" id="intro">
      Start your fitness journey. Sign up or sign in to continue.
    </p>

    <form id="accountForm">
      <div id="nameField">
        <label for="fullName">Your name</label>
        <input
          id="fullName"
          type="text"
          autocomplete="name"
          placeholder="Enter your name"
        >
      </div>

      <label for="email">Email address</label>
      <input
        id="email"
        type="email"
        autocomplete="email"
        placeholder="you@example.com"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        autocomplete="new-password"
        placeholder="At least 6 characters"
        minlength="6"
        required
      >

      <button class="primary" id="submitButton" type="submit">
        Create account
      </button>
    </form>

    <div class="forgot" id="forgotArea" hidden>
      <button type="button" id="forgotButton">Forgot your password?</button>
    </div>

    <div class="divider">or</div>

    <button class="google" type="button" id="googleButton">
      Continue with Google
    </button>

    <div class="switch">
      <span id="switchText">Already have an account?</span>
      <button type="button" id="switchButton">Sign in</button>
    </div>

    <div id="message" role="status" aria-live="polite"></div>

    <a class="back" href="index.html">← Back to True Form</a>
  </main>

  <!-- Firebase browser SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDngbH6WUcfbhSB2Tt23VsanSBHd00-6JU",
      authDomain: "true-form-968a9.firebaseapp.com",
      projectId: "true-form-968a9",
      storageBucket: "true-form-968a9.firebasestorage.app",
      messagingSenderId: "512916642761",
      appId: "1:512916642761:web:718c1adaf4e0fbb008a618",
      measurementId: "G-SF0CJBH53P"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    const form = document.getElementById("accountForm");
    const nameField = document.getElementById("nameField");
    const fullName = document.getElementById("fullName");
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const heading = document.getElementById("heading");
    const intro = document.getElementById("intro");
    const submitButton = document.getElementById("submitButton");
    const switchText = document.getElementById("switchText");
    const switchButton = document.getElementById("switchButton");
    const googleButton = document.getElementById("googleButton");
    const forgotArea = document.getElementById("forgotArea");
    const forgotButton = document.getElementById("forgotButton");
    const message = document.getElementById("message");

    let isSignIn = false;
    let busy = false;

    function showMessage(text) {
      message.textContent = text;
      message.style.display = "block";
    }

    function hideMessage() {
      message.textContent = "";
      message.style.display = "none";
    }

    function setBusy(value) {
      busy = value;
      submitButton.disabled = value;
      googleButton.disabled = value;
      switchButton.disabled = value;
      forgotButton.disabled = value;
      submitButton.textContent = value
        ? "Please wait..."
        : (isSignIn ? "Sign in" : "Create account");
    }

    function updatePage() {
      heading.textContent = isSignIn ? "Welcome back" : "Create your account";
      intro.textContent = isSignIn
        ? "Sign in to continue your True Form journey."
        : "Start your fitness journey. Create an account to continue.";

      nameField.hidden = isSignIn;
      fullName.required = !isSignIn;
      password.autocomplete = isSignIn ? "current-password" : "new-password";
      forgotArea.hidden = !isSignIn;
      switchText.textContent = isSignIn
        ? "New to True Form?"
        : "Already have an account?";
      switchButton.textContent = isSignIn ? "Create account" : "Sign in";
      submitButton.textContent = isSignIn ? "Sign in" : "Create account";
      hideMessage();
    }

    switchButton.addEventListener("click", () => {
      if (busy) return;
      isSignIn = !isSignIn;
      updatePage();
    });

    function getTrainingChoice() {
      const params = new URLSearchParams(window.location.search);
      const fromUrl = params.get("training");
      const saved = sessionStorage.getItem("trueFormTraining");
      const choice = fromUrl || saved;

      if (choice === "home" || choice === "gym") {
        sessionStorage.setItem("trueFormTraining", choice);
        return choice;
      }

      return null;
    }

    function continueToProfile() {
      const training = getTrainingChoice();

      if (!training) {
        window.location.href = "index.html";
        return;
      }

      window.location.href =
        "describe-yourself.html?training=" + encodeURIComponent(training);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (busy) return;

      hideMessage();
      setBusy(true);

      try {
        if (isSignIn) {
          await auth.signInWithEmailAndPassword(
            email.value.trim(),
            password.value
          );
        } else {
          const name = fullName.value.trim();

          if (!name) {
            throw new Error("Please enter your name.");
          }

          const result = await auth.createUserWithEmailAndPassword(
            email.value.trim(),
            password.value
          );

          await result.user.updateProfile({ displayName: name });
        }

        continueToProfile();
      } catch (error) {
        const messages = {
          "auth/email-already-in-use": "An account already exists with this email. Try signing in.",
          "auth/invalid-email": "Please enter a valid email address.",
          "auth/weak-password": "Please choose a stronger password with at least 6 characters.",
          "auth/user-not-found": "No account was found for this email. Check the address or create an account.",
          "auth/wrong-password": "That password is incorrect. Please try again.",
          "auth/invalid-credential": "Your email or password is incorrect. Please check and try again.",
          "auth/too-many-requests": "Too many attempts. Please wait a little before trying again.",
          "auth/network-request-failed": "Connection problem. Check your internet and try again.",
          "auth/unauthorized-domain": "This website domain is not authorized in Firebase yet. Add the website domain under Firebase Authentication settings."
        };

        showMessage(messages[error.code] || error.message || "Something went wrong. Please try again.");
      } finally {
        setBusy(false);
      }
    });

    googleButton.addEventListener("click", async () => {
      if (busy) return;

      hideMessage();
      setBusy(true);

      try {
        const provider = new firebase.auth.GoogleAuthProvider();
        const result = await auth.signInWithPopup(provider);

        if (result.user) {
          continueToProfile();
        }
      } catch (error) {
        if (error.code === "auth/popup-blocked" ||
            error.code === "auth/popup-closed-by-user") {
          showMessage("The Google sign-in window was closed or blocked. Please try again.");
        } else if (error.code === "auth/unauthorized-domain") {
          showMessage("This website domain is not authorized in Firebase yet. Add it under Firebase Authentication settings.");
        } else {
          showMessage(error.message || "Google sign-in failed. Please try again.");
        }
      } finally {
        setBusy(false);
      }
    });

    forgotButton.addEventListener("click", async () => {
      const address = email.value.trim();

      if (!address) {
        showMessage("Enter your email address above first, then tap Forgot your password.");
        email.focus();
        return;
      }

      try {
        await auth.sendPasswordResetEmail(address);
        showMessage("If an account exists for that email, a password reset email has been sent.");
      } catch (error) {
        showMessage(error.message || "Could not send the reset email. Please try again.");
      }
    });

    auth.onAuthStateChanged((user) => {
      if (user) {
        // Stay on this page until the user submits or chooses Google.
        // This avoids unexpected redirects while editing the form.
      }
    });

    updatePage();
  </script>
</body>
</html>
