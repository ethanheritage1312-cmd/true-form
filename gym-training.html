<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Training At Your Gym | True Form</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f5f0e8;
      color: #20201e;
      font-family: Arial, sans-serif;
    }
    main {
      width: 100%;
      max-width: 520px;
      padding: 32px 24px;
      background: white;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 10px 30px #0000000d;
    }
    .brand {
      margin-bottom: 28px;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 2px;
    }
    .brand span { color: #c76f4b; }
    .step {
      color: #c76f4b;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    h1 { font-size: 30px; }
    p {
      color: #77736d;
      line-height: 1.7;
      font-size: 15px;
    }
    a.button {
      display: block;
      margin-top: 24px;
      padding: 16px;
      border-radius: 9px;
      background: #c76f4b;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
    a.back {
      display: inline-block;
      margin-top: 22px;
      color: #77736d;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">TRUE <span>FORM</span></div>
    <div class="step">Your fitness journey · Step 1</div>
    <h1>Make every session count.</h1>
    <p>
      Follow a structured gym training plan built around your
      goals, experience, available equipment and schedule.
    </p>
    <p>Next, create your account and tell us about yourself.</p>
    <a class="button" href="account.html?training=gym">
      Continue to create your account
    </a>
    <a class="back" href="index.html">← Back to home</a>
  </main>
</body>
</html>
